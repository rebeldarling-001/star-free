<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FFXIPL Leaderboard</title>

<link rel="stylesheet" href="leaderboard.css">
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>

<body>

<div class="app">
  <!-- HEADER -->

<header class="top-header">

<button class="x-return-btn" id="homeButton">


<div class="return-icon">
    🏠
</div>
    <div class="return-text">
        <span>BASE</span>
        <b></b>
    </div>

</button>

    <div class="logo-box">
        <div class="logo-title">
            <span class="gold">FREEFIRE</span>
            <span class="white">XIPL</span>
        </div>

        <div class="season">
            SEASON 11
        </div>
    </div>

</header>

  <!-- ADMIN -->

<div class="card admin" id="adminCard">

    <div class="admin-top">

        <div class="admin-title">
            🛡 ADMIN ACCESS
        </div>

        <div id="lockIcon" class="lock-icon">
            🔒
        </div>

    </div>

    <div class="admin-box">
        <input type="password" id="pass" placeholder="Enter Admin Password">
        <button onclick="login()">LOGIN</button>
    </div>

    <div id="status" class="status">
        🔒 Locked
    </div>

</div>

  <!-- TABLE -->
  <div class="card table">

    <div class="row head">
      <div>RANK</div>
      <div>TEAM</div>
      <div>M</div>
      <div>W</div>
      <div>L</div>
      <div>PTS</div>
      <div>🔒</div>
    </div>

    <div id="rows"></div>

  </div>

  <!-- FOOTER -->
 <div class="footer">
  <span>FFXIPL • FEEL THE FIGHT. LIVE THE GLORY.</span>
  <span class="dot"></span>
  <span>Real-time Updates</span>
</div>

</div>

<script src="leaderboard.js"></script>
</body>
</html>
