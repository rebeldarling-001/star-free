<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>FREEFIREXIPL Schedule</title>

<link rel="stylesheet"
href="schedule.css">

<link
href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&display=swap"
rel="stylesheet">

<link rel="stylesheet"
href="https://use.fontawesome.com/releases/v6.5.2/css/all.css">

</head>

<body>

<div class="schedule-page">

<!-- HEADER -->

<header class="top-header">

<button class="x-return-btn" id="homeButton">

<div class="return-icon">
<i class="fas fa-house"></i>
</div>

<div class="return-text">
<span>BASE</span>
<b></b>
</div>

</button>

<div class="logo-box">

<div class="logo-title">

<span class="gold">FREEFIRE</span>

<span class="white">XIPL</span>

</div>

<div class="season">
SEASON 11
</div>

</div>


</header>



<!-- BANNER -->

<section class="schedule-banner">

<h1>SCHEDULE</h1>

<p>
ALL MATCHES. ONE DESTINATION.
</p>

</section>

<!-- DATE BAR -->

<div class="date-slider">

<div class="date-card active">

<div class="day">
TODAY
</div>

<div class="date">
08 FEB
</div>

</div>

<div class="date-card">

<div class="day">
WED
</div>

<div class="date">
09 FEB
</div>

</div>

<div class="date-card">

<div class="day">
THU
</div>

<div class="date">
10 FEB
</div>

</div>

<div class="date-card">

<div class="day">
FRI
</div>

<div class="date">
11 FEB
</div>

</div>

<div class="date-card">

<div class="day">
SAT
</div>

<div class="date">
12 FEB
</div>

</div>

</div>

<!-- MATCH TITLE -->

<div class="section-title">

<div>
TODAY'S MATCHES
</div>

<div class="live-text">

<span class="live-dot"></span>

LIVE

</div>

</div>

<!-- MATCH LIST -->

<div id="matchContainer"></div>

<!-- VIEW ALL -->

<div class="view-all">

<div>

<h3>
VIEW FULL SCHEDULE
</h3>

<p>
See upcoming matches &
results
</p>

</div>

<i class="fas fa-chevron-right"></i>

</div>


</div>




<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>

<script src="schedule.js"></script>

</body>

</html>
